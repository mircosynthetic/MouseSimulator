name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Generate Project
        run: |
          mkdir -p app/src/main/java/com/example/mousesimulator
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle << 'ENDFILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MouseSimulator"
          include ':app'
          ENDFILE

          cat > build.gradle << 'ENDFILE'
          plugins {
              id 'com.android.application' version '8.1.0' apply false
          }
          ENDFILE

          cat > gradle.properties << 'ENDFILE'
          android.useAndroidX=true
          android.suppressUnsupportedCompileSdk=34
          org.gradle.jvmargs=-Xmx2048m
          ENDFILE

          cat > app/build.gradle << 'ENDFILE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.mousesimulator'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.mousesimulator"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          ENDFILE

          cat > app/src/main/AndroidManifest.xml << 'ENDFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application
                  android:allowBackup="true"
                  android:label="MouseSim"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".CursorService" android:exported="false" />
                  <service android:name=".MouseAccessibilityService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          ENDFILE

          cat > app/src/main/res/xml/accessibility_service_config.xml << 'ENDFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="false"
              android:description="@string/accessibility_description"
              android:notificationTimeout="100" />
          ENDFILE

          cat > app/src/main/res/values/strings.xml << 'ENDFILE'
          <resources>
              <string name="app_name">Mouse Simulator</string>
              <string name="accessibility_description">Simula click mouse</string>
          </resources>
          ENDFILE

          cat > app/src/main/res/layout/activity_main.xml << 'ENDFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="32dp"
              android:background="#1A1A2E">
              <TextView android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Mouse Simulator"
                  android:textColor="#FFFFFF"
                  android:textSize="28sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="16dp" />
              <TextView android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Freccia + Click sul tuo schermo"
                  android:textColor="#AAAAAA"
                  android:textSize="16sp"
                  android:layout_marginBottom="32dp" />
              <Button android:id="@+id/btnStart"
                  android:layout_width="250dp"
                  android:layout_height="60dp"
                  android:text="Avvia Mouse"
                  android:textSize="18sp"
                  android:layout_marginBottom="16dp" />
              <Button android:id="@+id/btnStop"
                  android:layout_width="250dp"
                  android:layout_height="60dp"
                  android:text="Ferma Mouse"
                  android:textSize="18sp"
                  android:enabled="false" />
          </LinearLayout>
          ENDFILE

          cat > app/src/main/java/com/example/mousesimulator/MainActivity.java << 'ENDFILE'
          package com.example.mousesimulator;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  Button btnStart = findViewById(R.id.btnStart);
                  Button btnStop = findViewById(R.id.btnStop);
                  btnStart.setOnClickListener(v -> {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())));
                          return;
                      }
                      if (MouseAccessibilityService.getInstance() == null) {
                          startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                          Toast.makeText(this, "Attiva MouseSimulator in Accessibilita", Toast.LENGTH_LONG).show();
                          return;
                      }
                      startService(new Intent(this, CursorService.class));
                      btnStart.setEnabled(false);
                      btnStop.setEnabled(true);
                      Toast.makeText(this, "Freccia attiva!", Toast.LENGTH_SHORT).show();
                  });
                  btnStop.setOnClickListener(v -> {
                      stopService(new Intent(this, CursorService.class));
                      btnStart.setEnabled(true);
                      btnStop.setEnabled(false);
                  });
              }
          }
          ENDFILE

          cat > app/src/main/java/com/example/mousesimulator/MouseAccessibilityService.java << 'ENDFILE'
          package com.example.mousesimulator;
          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.accessibility.AccessibilityEvent;
          public class MouseAccessibilityService extends AccessibilityService {
              private static MouseAccessibilityService instance;
              public static MouseAccessibilityService getInstance() { return instance; }
              @Override public void onServiceConnected() { super.onServiceConnected(); instance = this; }
              @Override public void onDestroy() { instance = null; super.onDestroy(); }
              @Override public void onAccessibilityEvent(AccessibilityEvent e) {}
              @Override public void onInterrupt() {}
              public void performClick(float x, float y) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.N) return;
                  Path p = new Path(); p.moveTo(x, y);
                  dispatchGesture(new GestureDescription.Builder()
                      .addStroke(new GestureDescription.StrokeDescription(p, 0, 100)).build(), null, null);
              }
              public void performDoubleClick(float x, float y) {
                  performClick(x, y);
                  new Handler(Looper.getMainLooper()).postDelayed(() -> performClick(x, y), 80);
              }
              public void performLongClick(float x, float y) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.N) return;
                  Path p = new Path(); p.moveTo(x, y);
                  dispatchGesture(new GestureDescription.Builder()
                      .addStroke(new GestureDescription.StrokeDescription(p, 0, 600)).build(), null, null);
              }
          }
          ENDFILE

          cat > app/src/main/java/com/example/mousesimulator/CursorService.java << 'ENDFILE'
          package com.example.mousesimulator;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.IBinder;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class CursorService extends Service {
              private WindowManager wm;
              private View cursorView;
              private View controlView;
              private WindowManager.LayoutParams cursorParams;
              private WindowManager.LayoutParams controlParams;
              private float cursorX, cursorY;
              private int screenWidth, screenHeight;

              @Override public IBinder onBind(Intent i) { return null; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  screenWidth = getResources().getDisplayMetrics().widthPixels;
                  screenHeight = getResources().getDisplayMetrics().heightPixels;
                  cursorX = screenWidth / 2f;
                  cursorY = screenHeight / 2f;
                  createCursor();
                  createControlPanel();
              }

              private void createCursor() {
                  cursorView = new TextView(this);
                  ((TextView) cursorView).setText("\u27A4");
                  ((TextView) cursorView).setTextSize(TypedValue.COMPLEX_UNIT_SP, 40);
                  ((TextView) cursorView).setTextColor(Color.RED);
                  ((TextView) cursorView).setShadowLayer(8, 2, 2, Color.BLACK);

                  cursorParams = new WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                      PixelFormat.TRANSLUCENT);
                  cursorParams.gravity = Gravity.TOP | Gravity.START;
                  cursorParams.x = (int) cursorX;
                  cursorParams.y = (int) cursorY;
                  wm.addView(cursorView, cursorParams);
              }

              private void createControlPanel() {
                  LinearLayout panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setPadding(8, 8, 8, 8);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(0xDD000000);
                  bg.setCornerRadius(20);
                  bg.setStroke(2, 0xFF4444FF);
                  panel.setBackground(bg);

                  TextView title = new TextView(this);
                  title.setText("\uD83D\uDDB1\uFE0F Mouse");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14);
                  title.setGravity(Gravity.CENTER);
                  panel.addView(title);

                  View trackpad = new View(this);
                  LinearLayout.LayoutParams tpParams = new LinearLayout.LayoutParams(
                      dp(180), dp(120));
                  tpParams.topMargin = dp(4);
                  trackpad.setLayoutParams(tpParams);
                  GradientDrawable tpBg = new GradientDrawable();
                  tpBg.setColor(0xFF2A2A5A);
                  tpBg.setCornerRadius(10);
                  trackpad.setBackground(tpBg);
                  panel.addView(trackpad);

                  LinearLayout btnRow = new LinearLayout(this);
                  btnRow.setOrientation(LinearLayout.HORIZONTAL);
                  LinearLayout.LayoutParams rowParams = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, dp(44));
                  rowParams.topMargin = dp(4);
                  btnRow.setLayoutParams(rowParams);

                  Button btnClick = makeButton("\uD83D\uDC46 Click");
                  Button btnDouble = makeButton("\uD83D\uDC46\u200D\uD83D\uDC46 Doppio");
                  Button btnLong = makeButton("\u270B Lungo");

                  btnRow.addView(btnClick);
                  btnRow.addView(btnDouble);
                  btnRow.addView(btnLong);
                  panel.addView(btnRow);

                  controlParams = new WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT);
                  controlParams.gravity = Gravity.TOP | Gravity.START;
                  controlParams.x = 20;
                  controlParams.y = screenHeight - dp(280);

                  wm.addView(panel, controlParams);
                  controlView = panel;

                  title.setOnTouchListener(new View.OnTouchListener() {
                      private int ix, iy;
                      private float tx, ty;
                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          if (e.getAction() == MotionEvent.ACTION_DOWN) {
                              ix = controlParams.x; iy = controlParams.y;
                              tx = e.getRawX(); ty = e.getRawY();
                              return true;
                          }
                          if (e.getAction() == MotionEvent.ACTION_MOVE) {
                              controlParams.x = ix + (int)(e.getRawX() - tx);
                              controlParams.y = iy + (int)(e.getRawY() - ty);
                              wm.updateViewLayout(controlView, controlParams);
                              return true;
                          }
                          return false;
                      }
                  });

                  trackpad.setOnTouchListener(new View.OnTouchListener() {
                      private float lx, ly;
                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          if (e.getAction() == MotionEvent.ACTION_DOWN) {
                              lx = e.getRawX(); ly = e.getRawY();
                              return true;
                          }
                          if (e.getAction() == MotionEvent.ACTION_MOVE) {
                              cursorX += (e.getRawX() - lx) * 2.5f;
                              cursorY += (e.getRawY() - ly) * 2.5f;
                              cursorX = Math.max(0, Math.min(cursorX, screenWidth - 40));
                              cursorY = Math.max(0, Math.min(cursorY, screenHeight - 40));
                              cursorParams.x = (int) cursorX;
                              cursorParams.y = (int) cursorY;
                              wm.updateViewLayout(cursorView, cursorParams);
                              lx = e.getRawX(); ly = e.getRawY();
                              return true;
                          }
                          return false;
                      }
                  });

                  btnClick.setOnClickListener(v -> {
                      MouseAccessibilityService s = MouseAccessibilityService.getInstance();
                      if (s != null) s.performClick(cursorX + 20, cursorY + 20);
                  });
                  btnDouble.setOnClickListener(v -> {
                      MouseAccessibilityService s = MouseAccessibilityService.getInstance();
                      if (s != null) s.performDoubleClick(cursorX + 20, cursorY + 20);
                  });
                  btnLong.setOnClickListener(v -> {
                      MouseAccessibilityService s = MouseAccessibilityService.getInstance();
                      if (s != null) s.performLongClick(cursorX + 20, cursorY + 20);
                  });
              }

              private Button makeButton(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextSize(TypedValue.COMPLEX_UNIT_SP, 10);
                  b.setTextColor(Color.WHITE);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1);
                  lp.setMargins(2, 0, 2, 0);
                  b.setLayoutParams(lp);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(0xFF333366);
                  bg.setCornerRadius(8);
                  b.setBackground(bg);
                  b.setAllCaps(false);
                  return b;
              }

              private int dp(int v) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics());
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (cursorView != null) wm.removeView(cursorView);
                  if (controlView != null) wm.removeView(controlView);
              }
          }
          ENDFILE

      - name: Build APK
        run: gradle assembleDebug

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0
          name: MouseSimulator v2 - Freccia + Click
          body: Freccia rossa visibile + pannello click
          files: app/build/outputs/apk/debug/app-debug.apk
