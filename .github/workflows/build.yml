name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Generate Project
        run: |
          mkdir -p app/src/main/java/com/example/mousesimulator
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle << 'ENDFILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MouseSimulator"
          include ':app'
          ENDFILE

          cat > build.gradle << 'ENDFILE'
          plugins {
              id 'com.android.application' version '8.1.0' apply false
          }
          ENDFILE

          cat > gradle.properties << 'ENDFILE'
          android.useAndroidX=true
          android.suppressUnsupportedCompileSdk=34
          org.gradle.jvmargs=-Xmx2048m
          ENDFILE

          cat > app/build.gradle << 'ENDFILE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.mousesimulator'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.mousesimulator"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          ENDFILE

          cat > app/src/main/AndroidManifest.xml << 'ENDFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application
                  android:allowBackup="true"
                  android:label="MouseSim"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".CursorService" android:exported="false" />
                  <service android:name=".MouseAccessibilityService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          ENDFILE

          cat > app/src/main/res/xml/accessibility_service_config.xml << 'ENDFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="false"
              android:description="@string/accessibility_description"
              android:notificationTimeout="100" />
          ENDFILE

          cat > app/src/main/res/values/strings.xml << 'ENDFILE'
          <resources>
              <string name="app_name">Mouse Simulator</string>
              <string name="accessibility_description">Simula click mouse</string>
          </resources>
          ENDFILE

          cat > app/src/main/res/layout/activity_main.xml << 'ENDFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="32dp"
              android:background="#1A1A2E">
              <TextView android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Mouse Simulator"
                  android:textColor="#FFFFFF"
                  android:textSize="28sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="32dp" />
              <Button android:id="@+id/btnStart"
                  android:layout_width="250dp"
                  android:layout_height="60dp"
                  android:text="Avvia Mouse"
                  android:textSize="18sp" />
          </LinearLayout>
          ENDFILE

          cat > app/src/main/java/com/example/mousesimulator/MainActivity.java << 'ENDFILE'
          package com.example.mousesimulator;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  findViewById(R.id.btnStart).setOnClickListener(v -> {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())));
                          return;
                      }
                      if (MouseAccessibilityService.getInstance() == null) {
                          startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                          Toast.makeText(this, "Attiva MouseSimulator", Toast.LENGTH_LONG).show();
                          return;
                      }
                      startService(new Intent(this, CursorService.class));
                      Toast.makeText(this, "Mouse avviato!", Toast.LENGTH_SHORT).show();
                      finish();
                  });
              }
          }
          ENDFILE

          cat > app/src/main/java/com/example/mousesimulator/MouseAccessibilityService.java << 'ENDFILE'
          package com.example.mousesimulator;
          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.accessibility.AccessibilityEvent;
          public class MouseAccessibilityService extends AccessibilityService {
              private static MouseAccessibilityService instance;
              public static MouseAccessibilityService getInstance() { return instance; }
              @Override public void onServiceConnected() { super.onServiceConnected(); instance = this; }
              @Override public void onDestroy() { instance = null; super.onDestroy(); }
              @Override public void onAccessibilityEvent(AccessibilityEvent e) {}
              @Override public void onInterrupt() {}
              public void performClick(float x, float y) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.N) return;
                  Path p = new Path(); p.moveTo(x, y);
                  dispatchGesture(new GestureDescription.Builder()
                      .addStroke(new GestureDescription.StrokeDescription(p, 0, 150)).build(), null, null);
              }
              public void performDoubleClick(float x, float y) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.N) return;
                  performClick(x, y);
                  new Handler(Looper.getMainLooper()).postDelayed(() -> performClick(x, y), 350);
              }
              public void performLongClick(float x, float y) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.N) return;
                  Path p = new Path(); p.moveTo(x, y);
                  dispatchGesture(new GestureDescription.Builder()
                      .addStroke(new GestureDescription.StrokeDescription(p, 0, 800)).build(), null, null);
              }
          }
          ENDFILE

          cat > app/src/main/java/com/example/mousesimulator/CursorService.java << 'ENDFILE'
          package com.example.mousesimulator;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.IBinder;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class CursorService extends Service {
              private WindowManager wm;
              private View cursorView;
              private View controlView;
              private WindowManager.LayoutParams cursorParams;
              private WindowManager.LayoutParams controlParams;
              private float cursorX, cursorY;
              private int screenW, screenH;

              @Override public IBinder onBind(Intent i) { return null; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  screenW = getResources().getDisplayMetrics().widthPixels;
                  screenH = getResources().getDisplayMetrics().heightPixels;
                  cursorX = screenW / 2f;
                  cursorY = screenH / 2f;
                  createCursor();
                  createPanel();
              }

              private int dp(int v) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics());
              }

              private void createCursor() {
                  int size = dp(80);
                  cursorView = new View(this) {
                      private Paint paintOuter = new Paint(Paint.ANTI_ALIAS_FLAG);
                      private Paint paintInner = new Paint(Paint.ANTI_ALIAS_FLAG);
                      private Paint paintCross = new Paint(Paint.ANTI_ALIAS_FLAG);
                      {
                          paintOuter.setColor(0xFFFF0000);
                          paintOuter.setStyle(Paint.Style.FILL);
                          paintInner.setColor(0xFFFFFF00);
                          paintInner.setStyle(Paint.Style.FILL);
                          paintCross.setColor(0xFF000000);
                          paintCross.setStyle(Paint.Style.STROKE);
                          paintCross.setStrokeWidth(dp(3));
                      }
                      @Override
                      protected void onDraw(Canvas c) {
                          int cx = getWidth() / 2;
                          int cy = getHeight() / 2;
                          int r = Math.min(cx, cy) - dp(4);
                          c.drawCircle(cx, cy, r, paintOuter);
                          c.drawCircle(cx, cy, r - dp(8), paintInner);
                          c.drawCircle(cx, cy, r - dp(14), paintOuter);
                          c.drawLine(cx - r, cy, cx + r, cy, paintCross);
                          c.drawLine(cx, cy - r, cx, cy + r, paintCross);
                      }
                  };
                  cursorParams = new WindowManager.LayoutParams(
                      size, size,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT);
                  cursorParams.gravity = Gravity.TOP | Gravity.START;
                  cursorParams.x = (int) cursorX - size / 2;
                  cursorParams.y = (int) cursorY - size / 2;
                  wm.addView(cursorView, cursorParams);
              }

              private void createPanel() {
                  int pad = dp(10);
                  LinearLayout panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setPadding(pad, pad, pad, pad);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(0xEE111133);
                  bg.setCornerRadius(dp(16));
                  bg.setStroke(dp(2), Color.CYAN);
                  panel.setBackground(bg);

                  LinearLayout titleRow = new LinearLayout(this);
                  titleRow.setOrientation(LinearLayout.HORIZONTAL);
                  titleRow.setGravity(Gravity.CENTER_VERTICAL);

                  TextView title = new TextView(this);
                  title.setText("  Mouse  ");
                  title.setTextColor(Color.CYAN);
                  title.setTextSize(TypedValue.COMPLEX_UNIT_SP, 16);
                  LinearLayout.LayoutParams titleLp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1);
                  title.setLayoutParams(titleLp);
                  titleRow.addView(title);

                  Button btnClose = new Button(this);
                  btnClose.setText("X");
                  btnClose.setTextColor(Color.WHITE);
                  btnClose.setTextSize(TypedValue.COMPLEX_UNIT_SP, 16);
                  btnClose.setAllCaps(false);
                  btnClose.setPadding(0, 0, 0, 0);
                  LinearLayout.LayoutParams closeLp = new LinearLayout.LayoutParams(dp(36), dp(36));
                  btnClose.setLayoutParams(closeLp);
                  GradientDrawable closeBg = new GradientDrawable();
                  closeBg.setColor(0xFFCC0000);
                  closeBg.setCornerRadius(dp(18));
                  btnClose.setBackground(closeBg);
                  btnClose.setOnClickListener(v -> stopSelf());
                  titleRow.addView(btnClose);
                  panel.addView(titleRow);

                  View trackpad = new View(this);
                  int tpW = dp(200);
                  int tpH = dp(140);
                  LinearLayout.LayoutParams tpLp = new LinearLayout.LayoutParams(tpW, tpH);
                  tpLp.topMargin = dp(6);
                  trackpad.setLayoutParams(tpLp);
                  GradientDrawable tpBg = new GradientDrawable();
                  tpBg.setColor(0xFF3333AA);
                  tpBg.setCornerRadius(dp(10));
                  tpBg.setStroke(dp(1), Color.CYAN);
                  trackpad.setBackground(tpBg);
                  panel.addView(trackpad);

                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  LinearLayout.LayoutParams rowLp = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, dp(48));
                  rowLp.topMargin = dp(6);
                  row.setLayoutParams(rowLp);

                  Button bClick = mkBtn("Click");
                  Button bDouble = mkBtn("Doppio");
                  Button bLong = mkBtn("Lungo");
                  row.addView(bClick);
                  row.addView(bDouble);
                  row.addView(bLong);
                  panel.addView(row);

                  controlParams = new WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT);
                  controlParams.gravity = Gravity.TOP | Gravity.START;
                  controlParams.x = dp(10);
                  controlParams.y = screenH - dp(300);
                  controlView = panel;
                  wm.addView(panel, controlParams);

                  title.setOnTouchListener((v, e) -> {
                      if (e.getAction() == MotionEvent.ACTION_DOWN) {
                          v.setTag(new float[]{controlParams.x - e.getRawX(), controlParams.y - e.getRawY()});
                          return true;
                      }
                      if (e.getAction() == MotionEvent.ACTION_MOVE) {
                          float[] d = (float[]) v.getTag();
                          controlParams.x = (int)(e.getRawX() + d[0]);
                          controlParams.y = (int)(e.getRawY() + d[1]);
                          wm.updateViewLayout(controlView, controlParams);
                          return true;
                      }
                      return false;
                  });

                  trackpad.setOnTouchListener((v, e) -> {
                      if (e.getAction() == MotionEvent.ACTION_DOWN) {
                          v.setTag(new float[]{e.getRawX(), e.getRawY()});
                          return true;
                      }
                      if (e.getAction() == MotionEvent.ACTION_MOVE) {
                          float[] l = (float[]) v.getTag();
                          cursorX += (e.getRawX() - l[0]) * 2.5f;
                          cursorY += (e.getRawY() - l[1]) * 2.5f;
                          cursorX = Math.max(40, Math.min(cursorX, screenW - 40));
                          cursorY = Math.max(40, Math.min(cursorY, screenH - 40));
                          int size = dp(80);
                          cursorParams.x = (int) cursorX - size / 2;
                          cursorParams.y = (int) cursorY - size / 2;
                          wm.updateViewLayout(cursorView, cursorParams);
                          v.setTag(new float[]{e.getRawX(), e.getRawY()});
                          return true;
                      }
                      return false;
                  });

                  bClick.setOnClickListener(v -> doClick(1));
                  bDouble.setOnClickListener(v -> doClick(2));
                  bLong.setOnClickListener(v -> doClick(3));
              }

              private void doClick(int type) {
                  MouseAccessibilityService s = MouseAccessibilityService.getInstance();
                  if (s == null) return;
                  if (type == 1) s.performClick(cursorX, cursorY);
                  else if (type == 2) s.performDoubleClick(cursorX, cursorY);
                  else s.performLongClick(cursorX, cursorY);
              }

              private Button mkBtn(String txt) {
                  Button b = new Button(this);
                  b.setText(txt);
                  b.setTextSize(TypedValue.COMPLEX_UNIT_SP, 11);
                  b.setTextColor(Color.WHITE);
                  b.setAllCaps(false);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1);
                  lp.setMargins(dp(2), 0, dp(2), 0);
                  b.setLayoutParams(lp);
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(0xFF2244AA);
                  g.setCornerRadius(dp(8));
                  b.setBackground(g);
                  return b;
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  try { if (cursorView != null) wm.removeView(cursorView); } catch (Exception e) {}
                  try { if (controlView != null) wm.removeView(controlView); } catch (Exception e) {}
              }
          }
          ENDFILE

      - name: Build APK
        run: gradle assembleDebug

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.0
          name: MouseSimulator v7 - Mirino Grande
          body: Mirino gigante rosso e giallo al centro schermo
          files: app/build/outputs/apk/debug/app-debug.apk
