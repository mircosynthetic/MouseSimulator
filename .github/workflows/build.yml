name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Generate Project
        run: |
          mkdir -p app/src/main/java/com/example/mousesimulator
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          
          # settings.gradle CORRETTO
          cat > settings.gradle << 'ENDFILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MouseSimulator"
          include ':app'
          ENDFILE

          # build.gradle ROOT CORRETTO
          cat > build.gradle << 'ENDFILE'
          plugins {
              id 'com.android.application' version '8.1.0' apply false
          }
          ENDFILE

          cat > gradle.properties << 'ENDFILE'
          android.useAndroidX=true
          android.suppressUnsupportedCompileSdk=34
          ENDFILE

          # app/build.gradle
          cat > app/build.gradle << 'ENDFILE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.mousesimulator'
              compileSdk 34
              defaultConfig { applicationId "com.example.mousesimulator"; minSdk 26; targetSdk 34; versionCode 1; versionName "1.0" }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.material:material:1.11.0' }
          ENDFILE

          cat > app/src/main/AndroidManifest.xml << 'ENDFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application android:label="MouseSimV10" android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".CursorService" android:exported="false" />
                  <service android:name=".MouseAccessibilityService" android:exported="true" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter> <action android:name="android.accessibilityservice.AccessibilityService" /> </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          ENDFILE

          cat > app/src/main/res/xml/accessibility_service_config.xml << 'ENDFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:canPerformGestures="true" android:description="@string/desc" />
          ENDFILE
          cat > app/src/main/res/values/strings.xml << 'ENDFILE'
          <resources> <string name="app_name">MouseSimV10</string> <string name="desc">Remedy Clicker</string> </resources>
          ENDFILE
          cat > app/src/main/res/layout/activity_main.xml << 'ENDFILE'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:gravity="center" android:background="#121212">
              <Button android:id="@+id/btn" android:layout_width="200dp" android:layout_height="80dp" android:text="START MOUSE" />
          </LinearLayout>
          ENDFILE

          cat > app/src/main/java/com/example/mousesimulator/MainActivity.java << 'ENDFILE'
          package com.example.mousesimulator;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
                  findViewById(R.id.btn).setOnClickListener(v -> {
                      if (Settings.canDrawOverlays(this) && MouseAccessibilityService.getInstance() != null) {
                          startService(new Intent(this, CursorService.class));
                          finish();
                      } else {
                          startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())));
                          startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                      }
                  });
              }
          }
          ENDFILE

          cat > app/src/main/java/com/example/mousesimulator/MouseAccessibilityService.java << 'ENDFILE'
          package com.example.mousesimulator;
          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.view.accessibility.AccessibilityEvent;
          public class MouseAccessibilityService extends AccessibilityService {
              private static MouseAccessibilityService instance;
              public static MouseAccessibilityService getInstance() { return instance; }
              @Override public void onServiceConnected() { instance = this; }
              @Override public void onAccessibilityEvent(AccessibilityEvent e) {}
              @Override public void onInterrupt() {}

              public void remedyClick(float x, float y, boolean isDouble) {
                  Path p = new Path(); p.moveTo(x, y);
                  GestureDescription.Builder builder = new GestureDescription.Builder();
                  if (!isDouble) {
                      builder.addStroke(new GestureDescription.StrokeDescription(p, 0, 50));
                  } else {
                      builder.addStroke(new GestureDescription.StrokeDescription(p, 0, 50));
                      builder.addStroke(new GestureDescription.StrokeDescription(p, 250, 50));
                  }
                  dispatchGesture(builder.build(), null, null);
              }
          }
          ENDFILE

          cat > app/src/main/java/com/example/mousesimulator/CursorService.java << 'ENDFILE'
          package com.example.mousesimulator;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.*;
          import android.graphics.drawable.GradientDrawable;
          import android.os.IBinder;
          import android.util.DisplayMetrics;
          import android.util.TypedValue;
          import android.view.*;
          import android.widget.*;

          public class CursorService extends Service {
              private WindowManager wm;
              private View cur, pan;
              private WindowManager.LayoutParams cp, pp;
              private float cx, cy;
              private int sw, sh;

              @Override public IBinder onBind(Intent i) { return null; }
              @Override public void onCreate() {
                  super.onCreate();
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  DisplayMetrics dm = getResources().getDisplayMetrics();
                  sw = dm.widthPixels; sh = dm.heightPixels;
                  cx = sw / 2f; cy = sh / 2f;
                  
                  int size = dp(40);
                  cur = new View(this) {
                      Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                      @Override protected void onDraw(Canvas c) {
                          p.setColor(Color.RED); c.drawCircle(size/2f, size/2f, size/2f, p);
                          p.setColor(Color.WHITE); p.setStrokeWidth(4); p.setStyle(Paint.Style.STROKE);
                          c.drawCircle(size/2f, size/2f, size/2f-4, p);
                          c.drawLine(0, size/2f, size, size/2f, p); c.drawLine(size/2f, 0, size/2f, size, p);
                      }
                  };
                  cp = new WindowManager.LayoutParams(size, size, 2038, 520, -3);
                  cp.gravity = 51; cp.x = (int)cx - size/2; cp.y = (int)cy - size/2;
                  wm.addView(cur, cp);

                  LinearLayout pnl = new LinearLayout(this); pnl.setOrientation(1); pnl.setPadding(10,10,10,10);
                  GradientDrawable g = new GradientDrawable(); g.setColor(0xEE000000); g.setCornerRadius(20); g.setStroke(3, Color.YELLOW);
                  pnl.setBackground(g);

                  Button esc = new Button(this); esc.setText("ESCI"); esc.setOnClickListener(v->stopSelf());
                  pnl.addView(esc);

                  View pad = new View(this); pad.setBackgroundColor(0x33FFFFFF);
                  pnl.addView(pad, dp(200), dp(180));

                  Button b1 = new Button(this); b1.setText("CLICK");
                  b1.setOnClickListener(v -> { if(MouseAccessibilityService.getInstance()!=null) MouseAccessibilityService.getInstance().remedyClick(cx, cy, false); });
                  pnl.addView(b1);

                  Button b2 = new Button(this); b2.setText("DOPPIO CLICK");
                  b2.setOnClickListener(v -> { if(MouseAccessibilityService.getInstance()!=null) MouseAccessibilityService.getInstance().remedyClick(cx, cy, true); });
                  pnl.addView(b2);

                  pp = new WindowManager.LayoutParams(-2, -2, 2038, 8, -3);
                  pp.gravity = 81; wm.addView(pnl, pp); pan = pnl;

                  pad.setOnTouchListener((v, e) -> {
                      static float lx, ly;
                      if(e.getAction()==0) { lx=e.getRawX(); ly=e.getRawY(); return true; }
                      if(e.getAction()==2) {
                          cx += (e.getRawX()-lx)*2.2f; cy += (e.getRawY()-ly)*2.2f;
                          cx = Math.max(0, Math.min(cx, sw)); cy = Math.max(0, Math.min(cy, sh));
                          cp.x = (int)cx - size/2; cp.y = (int)cy - size/2;
                          wm.updateViewLayout(cur, cp); lx=e.getRawX(); ly=e.getRawY(); return true;
                      }
                      return false;
                  });
              }
              private int dp(int v) { return (int)TypedValue.applyDimension(1, v, getResources().getDisplayMetrics()); }
              @Override public void onDestroy() { super.onDestroy(); wm.removeView(cur); wm.removeView(pan); }
          }
          ENDFILE

      - name: Build APK
        run: gradle assembleDebug
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v10.1
          name: MouseSimulator V10.1
          files: app/build/outputs/apk/debug/app-debug.apk
