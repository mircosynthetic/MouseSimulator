name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Generate Project
        run: |
          mkdir -p app/src/main/java/com/example/mousesimulator
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle << 'ENDFILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MouseSimulator"
          include ':app'
          ENDFILE

          cat > build.gradle << 'ENDFILE'
          plugins {
              id 'com.android.application' version '8.1.0' apply false
          }
          ENDFILE

          cat > gradle.properties << 'ENDFILE'
          android.useAndroidX=true
          android.suppressUnsupportedCompileSdk=34
          org.gradle.jvmargs=-Xmx2048m
          ENDFILE

          cat > app/build.gradle << 'ENDFILE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.mousesimulator'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.mousesimulator"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          ENDFILE

          cat > app/src/main/AndroidManifest.xml << 'ENDFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application
                  android:allowBackup="true"
                  android:label="MouseSim"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".CursorService" android:exported="false" />
                  <service android:name=".MouseAccessibilityService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          ENDFILE

          cat > app/src/main/res/xml/accessibility_service_config.xml << 'ENDFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="false"
              android:description="@string/accessibility_description"
              android:notificationTimeout="100" />
          ENDFILE

          cat > app/src/main/res/values/strings.xml << 'ENDFILE'
          <resources>
              <string name="app_name">Mouse Simulator</string>
              <string name="accessibility_description">Simula click mouse per Remedy</string>
          </resources>
          ENDFILE

          cat > app/src/main/res/layout/activity_main.xml << 'ENDFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:background="#121212">
              <TextView android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Mouse Simulator"
                  android:textColor="#FFFFFF"
                  android:textSize="24sp"
                  android:layout_marginBottom="30dp" />
              <Button android:id="@+id/btnStart"
                  android:layout_width="200dp"
                  android:layout_height="60dp"
                  android:backgroundTint="#00CCFF"
                  android:text="AVVIA MOUSE" />
          </LinearLayout>
          ENDFILE

          cat > app/src/main/java/com/example/mousesimulator/MainActivity.java << 'ENDFILE'
          package com.example.mousesimulator;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  findViewById(R.id.btnStart).setOnClickListener(v -> {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())));
                          return;
                      }
                      if (MouseAccessibilityService.getInstance() == null) {
                          startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                          return;
                      }
                      startService(new Intent(this, CursorService.class));
                      finish();
                  });
              }
          }
          ENDFILE

          cat > app/src/main/java/com/example/mousesimulator/MouseAccessibilityService.java << 'ENDFILE'
          package com.example.mousesimulator;
          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.accessibility.AccessibilityEvent;
          public class MouseAccessibilityService extends AccessibilityService {
              private static MouseAccessibilityService instance;
              public static MouseAccessibilityService getInstance() { return instance; }
              @Override public void onServiceConnected() { super.onServiceConnected(); instance = this; }
              @Override public void onDestroy() { instance = null; super.onDestroy(); }
              @Override public void onAccessibilityEvent(AccessibilityEvent e) {}
              @Override public void onInterrupt() {}

              public void performClick(float x, float y) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.N) return;
                  Path p = new Path(); p.moveTo(x, y);
                  dispatchGesture(new GestureDescription.Builder()
                      .addStroke(new GestureDescription.StrokeDescription(p, 0, 150)).build(), null, null);
              }
              public void performDoubleClick(float x, float y) {
                  performClick(x, y);
                  new Handler(Looper.getMainLooper()).postDelayed(() -> performClick(x, y), 350);
              }
              public void performLongClick(float x, float y) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.N) return;
                  Path p = new Path(); p.moveTo(x, y);
                  dispatchGesture(new GestureDescription.Builder()
                      .addStroke(new GestureDescription.StrokeDescription(p, 0, 700)).build(), null, null);
              }
          }
          ENDFILE

          cat > app/src/main/java/com/example/mousesimulator/CursorService.java << 'ENDFILE'
          package com.example.mousesimulator;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.*;
          import android.graphics.drawable.GradientDrawable;
          import android.os.IBinder;
          import android.util.TypedValue;
          import android.view.*;
          import android.widget.*;

          public class CursorService extends Service {
              private WindowManager wm;
              private View cursorView, panelView;
              private WindowManager.LayoutParams cParams, pParams;
              private float cX, cY;
              private int sW, sH;

              @Override public IBinder onBind(Intent i) { return null; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  DisplayMetrics dm = getResources().getDisplayMetrics();
                  sW = dm.widthPixels;
                  sH = dm.heightPixels;
                  cX = sW / 2f;
                  cY = sH / 2f;
                  
                  // 1. MIRINO (CERCHIO ROSSO)
                  int size = dp(60);
                  cursorView = new View(this) {
                      Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                      @Override protected void onDraw(Canvas c) {
                          p.setColor(Color.RED); c.drawCircle(getWidth()/2f, getHeight()/2f, getWidth()/2f - 4, p);
                          p.setColor(Color.WHITE); p.setStrokeWidth(5); p.setStyle(Paint.Style.STROKE);
                          c.drawCircle(getWidth()/2f, getHeight()/2f, getWidth()/2f - 10, p);
                          c.drawLine(0, getHeight()/2f, getWidth(), getHeight()/2f, p);
                          c.drawLine(getWidth()/2f, 0, getWidth()/2f, getHeight(), p);
                      }
                  };
                  cParams = new WindowManager.LayoutParams(size, size,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT);
                  cParams.gravity = Gravity.TOP | Gravity.START;
                  cParams.x = (int)cX - size/2; cParams.y = (int)cY - size/2;
                  wm.addView(cursorView, cParams);

                  // 2. PANNELLO
                  LinearLayout panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setPadding(20, 20, 20, 20);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(0xFF222222); bg.setCornerRadius(30); bg.setStroke(4, Color.YELLOW);
                  panel.setBackground(bg);

                  LinearLayout head = new LinearLayout(this);
                  TextView title = new TextView(this); title.setText("MOUSE"); title.setTextColor(Color.YELLOW);
                  head.addView(title, new LinearLayout.LayoutParams(0, -2, 1f));
                  Button btnX = new Button(this); btnX.setText("ESCI"); btnX.setBackgroundColor(Color.RED); btnX.setTextColor(Color.WHITE);
                  btnX.setOnClickListener(v -> stopSelf());
                  head.addView(btnX, new LinearLayout.LayoutParams(dp(80), dp(45)));
                  panel.addView(head);

                  View tp = new View(this); tp.setBackgroundColor(0xFF444444);
                  panel.addView(tp, new LinearLayout.LayoutParams(dp(220), dp(150)));

                  LinearLayout btns = new LinearLayout(this);
                  String[] l = {"CLICK", "DOPPIO", "LUNGO"};
                  for(int i=0; i<3; i++) {
                      Button b = new Button(this); b.setText(l[i]);
                      int finalI = i; b.setOnClickListener(v -> {
                          MouseAccessibilityService s = MouseAccessibilityService.getInstance();
                          if(s!=null) {
                              if(finalI==0) s.performClick(cX, cY);
                              else if(finalI==1) s.performDoubleClick(cX, cY);
                              else s.performLongClick(cX, cY);
                          }
                      });
                      btns.addView(b, new LinearLayout.LayoutParams(0, -2, 1f));
                  }
                  panel.addView(btns);

                  pParams = new WindowManager.LayoutParams(-2, -2,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
                  pParams.gravity = Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL;
                  wm.addView(panel, pParams);
                  panelView = panel;

                  tp.setOnTouchListener((v, e) -> {
                      static float lx, ly;
                      if(e.getAction()==MotionEvent.ACTION_DOWN) { lx=e.getRawX(); ly=e.getRawY(); return true; }
                      if(e.getAction()==MotionEvent.ACTION_MOVE) {
                          cX += (e.getRawX()-lx)*2f; cY += (e.getRawY()-ly)*2f;
                          cX = Math.max(0, Math.min(cX, sW)); cY = Math.max(0, Math.min(cY, sH));
                          cParams.x = (int)cX - size/2; cParams.y = (int)cY - size/2;
                          wm.updateViewLayout(cursorView, cParams);
                          lx=e.getRawX(); ly=e.getRawY(); return true;
                      }
                      return false;
                  });
              }

              private int dp(int v) { return (int)TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics()); }
              @Override public void onDestroy() { super.onDestroy(); if(cursorView!=null) wm.removeView(cursorView); if(panelView!=null) wm.removeView(panelView); }
          }
          ENDFILE

      - name: Build APK
        run: gradle assembleDebug

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.0
          name: MouseSimulator v8
          files: app/build/outputs/apk/debug/app-debug.apk
